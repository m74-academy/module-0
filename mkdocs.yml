site_name: M74 Academy · Module 0
docs_dir: docs
site_dir: site
repo_url: https://github.com/m74-academy/module-0
repo_name: m74-academy/module-0

theme:
  name: material
  variant: modern
  logo: assets/m74-logo.svg
  favicon: assets/m74-logo.svg
  palette:
    - scheme: slate
      toggle:
        icon: lucide/sun
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: lucide/moon
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - assets/keyboard-nav.css
  - assets/admonitions.css

extra_javascript:
  - assets/keyboard-nav.js

extra:
  status:
    gold: "Gold: optional lesson"

plugins:
  - search
  - tags

nav:
  - Start:
      - Start here: index.md
      - Install the software: setup/install-uv-and-git.md
      - Set up the module: setup/fork-clone-setup.md
  - "Ch 1 · Shot Inventory":
      - Overview: chapters/01-shot-inventory/README.md
      - "1.1 Names Carry Data": chapters/01-shot-inventory/01-names-carry-data.md
      - "1.2 Building Names with f-strings": chapters/01-shot-inventory/02-f-strings.md
      - "1.3 Splitting a Name into Parts": chapters/01-shot-inventory/03-splitting.md
      - "1.4 Numbers from Text": chapters/01-shot-inventory/04-numbers.md
      - "1.5 Frame Ranges and List Comprehensions": chapters/01-shot-inventory/05-ranges.md
      - "1.6 Sets: Finding Missing Frames": chapters/01-shot-inventory/06-sets.md
      - "1.7 Sorting Frames as Numbers": chapters/01-shot-inventory/07-sorting.md
      - "1.8 Dictionaries: Grouping by Sequence": chapters/01-shot-inventory/08-grouping.md
      - "1.9 Listing a Folder with os": chapters/01-shot-inventory/09-folders.md
      - "1.10 JSON as Memory": chapters/01-shot-inventory/10-json.md
      - "1.11 A Script You Can Run": chapters/01-shot-inventory/11-script.md
  - Capstone: capstone.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
